schema_version: '1.0'
catalog_version: 0.5.0
visual_catalog_url: https://quote-card-designer-catalogo-v1.vincos.chatgpt.site
defaults:
  ratio: '4:5'
  variants: 1
families:
- id: tipografia-editoriale
  name: Tipografia e impaginazione
  description: Caratteri, gerarchie e sovrapposizioni tipografiche costruiscono la composizione.
- id: geometrie-pattern
  name: Geometrie e pattern
  description: Moduli, campiture, trame di segni e illusioni ottiche danno ritmo alla frase.
- id: disegno-tecnico
  name: Disegno tecnico e wireframe
  description: Griglie spaziali, diagrammi, architetture e micrografica tecnica organizzano la pagina.
- id: collage-fotomontaggio
  name: Collage e fotomontaggio
  description: Ritagli, fotografie e frammenti di carta si ricompongono in immagini inattese.
- id: retini-stampa
  name: Retini e stampa
  description: Punti, pixel, sovrastampe e grana degli inchiostri sono il tratto visivo principale.
- id: fotografia-atmosfere
  name: Fotografia e atmosfere
  description: Fotografie, soggetti materici e scene oniriche dialogano con la citazione.
- id: luce-materiali
  name: Luce e materiali
  description: Riflessi, vetro, metallo, tessuti e campi di luce o colore caratterizzano la superficie.
- id: disegno-lettering
  name: Disegno e lettering
  description: Matita, biro, china, pennello e acquerello lasciano un segno manuale riconoscibile.
- id: illustrazione-decorazione
  name: Illustrazione e decorazione
  description: Sagome organiche, ornamenti, fumetti e mondi immaginati accompagnano la frase.
- id: classici-incisioni
  name: Classici e incisioni
  description: Pagine miniate, incisioni, repertori classici e tradizioni illustrative ispirano la card.
- id: cultura-digitale
  name: Interfacce e cultura digitale
  description: Finestre, editor, codici visivi del web, glitch e pannelli cyberpunk entrano nel progetto.

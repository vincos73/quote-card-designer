Design Style:
  Name: Digital Collage
  Concept: 'A high-stimulus digital collage language informed by digital marketing, Y2K internet, vaporwave,
    risograph printing, street posters and social carousels. Recompose digital information overload through
    layered photographic cutouts, oversized expressive typography and bold contrast. Re-edit monochrome
    cutouts of sculptures, animals, people and everyday technology with fluorescent colour and playful
    juxtaposition. Layered photography, oversized type and bold contrast define a constructed collage
    composition.

    '
  Canvas:
    Ratio: '4:5'
    Output: One flat social quote card
  Mood:
  - Bold
  - Energetic
  - Playful
  - Internet-native
  - Experimental
  - Rebellious
  - Graphic
  - Attention-grabbing
  Temperature:
    Overall: Hyper-saturated
  Color Palette:
    Background:
      ElectricBlue: '#0048FF'
      NeonPink: '#FF3CCF'
      AcidLime: '#D8FF2E'
    Primary:
      ElectricBlue: '#0048FF'
    Secondary:
      NeonPink: '#FF3CCF'
      AcidLime: '#D8FF2E'
    Accent:
      White: '#FFFFFF'
      Black: '#111111'
    Roles: 'Electric blue establishes the main field. Pink and lime interrupt it as decisive planes and
      message strips. Black and white carry photographic cutouts, contrast and legible type. Restrict
      this card to these five colours.

      '
  Typography:
    Headlines:
      Style: 'Extra-bold condensed sans-serif, huge and tightly fitted. Treat type as structural graphic
        material. A few oversized forms may push against boundaries, while the complete quotation remains
        readable.

        '
      Weight: 800-900
      Tracking: Natural letter spacing with optical kerning; create density through scale and layout,
        never by squeezing glyphs
      Case: Mixed; preserve the supplied quotation
      Scale: Oversized
    Secondary:
      Style: Poster sans-serif; fluorescent-label treatment for emphasis
      Weight: 500-700
    Body:
      Style: Simple sans-serif; only for supplied supporting content
      Weight: 400
      LineHeight: 1.2-1.4
  Layout:
    Structure: 'Dense editorial composition combining a social carousel cover and a street poster. A regular
      underlying grid supports deliberate trespass by type, cutouts and label strips. Maintain hierarchy
      through scale and contrast.

      '
    Composition:
    - Oversized structural typography
    - Collage layering
    - Dynamic asymmetry
    - Cutout imagery and floating message strips
    - Visual interruptions and aggressive overlap
    Alignment:
      Preference: Grid with disruption
      ControlledChaos: Medium
  Graphic Elements:
    Shapes:
    - Highlight strips and tape-like elements
    - Rounded labels and rectangular panels
    - Irregular cutouts and abstract blobs
    - Thick crosses and circles
    Symbols:
    - TV test-pattern fragments
    - Interface-like shapes without invented UI text
    - Arrows, dots, warning marks and smile icons
    - Graphic crosses and decorative underlines
    Decorative Rules:
    - Allow secondary marks to compete for attention.
    - Use repetition to create rhythm.
    - Overlap assertively and preserve hierarchy through scale.
    - Select compatible devices rather than including the entire repertoire.
    Patterns:
    - Halftone
    - Risograph grain and offset print texture
    - Mild print misregistration and digital noise
    - Typographic repetition only when the supplied copy permits it
  Imagery:
    Style: 'Monochrome photographic cutouts and classical imagery boldly re-edited with neon colour. Treat
      the selected subject as a playful graphic protagonist, integrated into the typography and planes.

      '
    Treatment:
    - Black-and-white cutouts
    - Thick coloured outlines
    - Duotone accents
    - Posterized contrast
    - Mixed scales and layered integration
    - Minimal shadows
    Subjects:
    - Classical sculptures and animals
    - Portraits and human gestures
    - Vintage electronics and everyday objects
    - Internet-culture motifs
  Background:
    Style: 'Switch boldly between blue, pink and lime planes. Use enlarged typography, pattern and graphic
      interruptions to evoke dense digital space, without inventing extra words to simulate information.

      '
  Effects:
    Texture: Risograph grain, offset print, slight halftone and digital noise
    Shadow: Minimal
    Depth: Flat collage layering
    Distortion: Mild print misregistration, occasional scan effects and controlled glitches
  Visual Rules:
  - Use blue, pink, lime, black and white only.
  - Use oversized typography as a structural element.
  - Apply fluorescent highlight strips to key messages.
  - Allow text to overlap imagery without obscuring words.
  - Create surprise and humour through collage.
  - Balance visual chaos with clear focal points.
  - Preserve mobile readability and feed stopping power.
  Exclusions:
  - Corporate minimalism and overly clean layouts
  - Luxury aesthetics and elegant serif typography
  - Muted earth tones and soft watercolour
  - Glassmorphism
  - Photorealistic lifestyle scenes
  - Complex 3D rendering
  Production:
    Preferred Mode: hybrid
    Reason: Ritagli fotografici, contorni neon, piani, strisce e grana devono interagire con una citazione
      esatta. L'ibrido permette di comporre il testo reale e usare visual generati come livelli; una semplice
      scritta posta sopra un'immagine perderebbe la collisione e il ritmo da collage.
    Content Adaptation: Se non sono disponibili maschere o livelli, generare un'immagine senza parole
      e collocare la citazione in un'area più quieta, rinunciando esplicitamente alla fusione con le lettere.
      Se la citazione è lunga, ridurre gli elementi e non chiedere al generatore di ripeterla.
    Required Capabilities: Livelli con alpha e maschere, ritaglio di silhouette, rotazione lieve dei ritagli,
      texture o pattern applicabili alle lettere, contorni, sovrapposizione controllata e testo letterale
      in primo piano.
    Current Prototype: Supporta immagini e testo separati, ma non maschere, rotazioni, texture, contorni
      o blend mode. Non può produrre l'integrazione tipografica del collage senza estensione o preparazione
      di asset esterni.
    Validation Status: Profilo finale non renderizzato nelle tre prove odierne. Il feedback positivo precedente
      su Neon Collage riguarda una versione e una frase diverse, quindi non valida Digital Collage.

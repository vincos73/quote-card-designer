Design Style:
  Name: Chinese Illustration
  Concept: An illustrated editorial quote card draws on traditional Chinese landscape painting, ink-and-watercolour
    illustration, fine engraved detail and blue-and-white porcelain. A pale ivory paper field carries
    a coherent monochrome-blue world of landscape and organic forms. Legible Latin serif typography occupies
    a luminous quiet opening within the illustration. Atmosphere and natural framing create a narrative
    page rather than an interface; preserve the Chinese illustration language without adding invented
    Chinese characters or decorative text.
  Canvas:
    Ratio: '4:5'
    Output: Single finished vertical editorial quote card, full bleed
  Mood:
  - Poetic
  - Illustrated
  - Classical
  - Serene
  - Bookish
  - Delicate
  Color Palette:
    Background:
      Ivory: '#F3EEDC'
      AgedIvory: '#EAE2CC'
      PaleBlueGray: '#D7E2E5'
    Illustration:
      PorcelainBlue: '#7899B0'
      MistBlue: '#9BB2C1'
      MidBlue: '#506D80'
      DeepBlue: '#243947'
    Text:
      BlueInk: '#293B47'
      MutedBlueInk: '#536672'
      LightIvory: '#F7F1DF'
    Roles: Ivory and low-saturation porcelain blue define the page. All landscape, botanical and architectural
      imagery uses tonal values of one blue ink. Dark blue carries the quotation, never pure black. No
      warm-coloured accents or vivid primary colours; warmth belongs only to the ivory paper.
  Typography:
    Primary:
      Style: Tall high-contrast classical serif with restrained decorative elegance
      Weight: Regular to medium, with legible fine strokes
      Role: Large quotation set as one coherent typographic voice
    Supporting:
      Style: Readable classical serif, optional short italic passage when explicitly appropriate
      Role: Only supplied supporting copy or attribution
    Hierarchy: A clear large quotation in a quiet pale field. Use natural line breaks and one consistent
      type size and glyph construction. Decorative character comes from the serif shapes, not illegible
      flourishes, multiple font changes or a long script passage. Preserve sentence capitalization.
  Layout:
    Structure:
    - A luminous central reading field
    - Balanced or subtly symmetrical cover-like composition
    - One or two restrained illustration groupings at the edges or lower field
    - Generous mist, sky and ivory negative space around the quotation
    Relationships: Let a small number of branches, landscape contours and pale atmospheric layers create
      an open natural frame around the quotation. Keep dark foreground details near the outer margins;
      distant forms become pale and dissolve into the reading field. Avoid a dense vignette directly behind the words. Central
      alignment is a useful first direction but not a mandatory template for every quotation.
  Imagery:
    Style: Monochrome-blue traditional Chinese ink-and-watercolour illustration with fine engraved detail
    Subjects:
    - Misty mountains and waterside landscapes
    - Trees, flowering branches and botanical studies
    - Birds, small animals and cloud forms
    - Gardens, distant architecture and symbolic objects
    Selection: Choose one coherent illustration group relevant to the words, with at most two framing
      concentrations. Leave a visibly broad, quiet margin around the reading field; do not catalogue every
      motif. Architecture is optional, not a compulsory
      cultural identifier.
    Treatment:
    - Softly bleeding outlines and matte pigment
    - Darker detailed foreground plants and pale distant landscape
    - Air perspective and luminous open mist
    - Fine reproduction grain rather than photographic realism
    Avoid:
    - Full-colour photography
    - Glossy porcelain product mockups
    - Flat cartoon scenery, anime figures and 3D rendering
  Graphic Elements:
    Repertoire:
    - Fine blue-grey book-like rules when needed
    - A delicate botanical or landscape boundary
    - An optional quiet ivory reading opening continuous with the paper
    Restraint: For a short quotation prefer mist and pale sky to opaque panels. Do not import presentation
      cards, translucent UI widgets or a stack of content boxes. Keep branches, blossoms and other dark details sparse and farther from the lettering so the quotation
      has more breathing room.
  Background:
    Surface: Warm ivory antique paper, subtle fibre and pale blue watercolour
    Depth: Atmospheric tonal distance within the illustration
    Reading Field: Central paper and a generous surrounding buffer stay pale and quiet, with no busy detail
      beneath or immediately beside letters
  Effects:
    Texture: Delicate paper grain and fine printed pigment
    Bleed: Soft watercolour edges, controlled and sparse near text
    Shadows: None
    Gradients: Only natural tonal wash and atmospheric fading, no digital colour-gradient effects
    Finish: Matte illustrated page
  Rules:
  - Render the supplied quotation once, preserving words, original case and final punctuation; omit enclosing
    quotation marks.
  - Keep the quotation the primary reading subject, clearly readable at mobile size.
  - Maintain the same font, size, weight and glyph proportions across the quotation unless a deliberate
    hierarchy is explicitly requested. Reposition imagery or reflow the whole block to solve collisions;
    never squeeze one word or line.
  - Use only supplied attribution and supporting text.
  - Reduce peripheral motifs before reducing the clear space around the quotation; keep edge details sparse
    and separated from the reading field.
  - Do not invent Chinese characters, seals with illegible text, captions, signatures, dates or decorative
    microtext.
  - Avoid neon, glossy 3D, flat icons, rounded SaaS panels, heavy shadows and saturated modern stock imagery.
  User Overrides:
    Format: Recompose the text and illustration for the requested card ratio.
    Palette: Honour requested changes while retaining the intended material and tonal relationships.
    Fonts: Honour requested fonts; preserve consistent letter construction throughout the quotation.
    Subject: Choose subject matter from the quotation or honour a supplied subject; examples do not define
      mandatory motifs.
  Production:
    Preferred Mode: hybrid
    Reason: L'illustrazione monocroma blu e l'apertura luminosa centrale possono essere generate senza
      testo; la citazione serif composta separatamente mantiene nitidezza e parole esatte. Il soggetto
      deve derivare dalla frase, non da simboli culturali obbligatori.
    Content Adaptation: Se l'immagine non lascia un intervallo chiaro, rigenerare o ricomporre il visual.
      Se strumenti di compositing non sono disponibili, usare un campo carta semplice e immagine marginale,
      senza inserire pseudo-calligrafia.
    Required Capabilities: Immagine raster originale, controllo dell'area di testo, maschere per sfumare
      i bordi del visual, composizione di serif reale e verifica del contrasto locale su carta.
    Current Prototype: Il prototipo può posizionare un'immagine pronta e testo reale, ma non crea acquerello/
      incisione, non sfuma bordi e non valuta automaticamente il contrasto nell'immagine.
    Validation Status: Profilo non renderizzato nei tre test odierni; integrazione della cornice monocroma
      e resa tipografica non verificate.

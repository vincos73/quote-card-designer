Design Style:
  Name: Modern Minimalism
  Concept: Una citazione e un suo estratto letterale ingrandito formano due masse tipografiche distinte, allineate
    allo stesso asse sinistro e ordinate da una griglia editoriale a quattro colonne. Sans-serif lineari, doppia
    scala monumentale, contrasto netto e apparato minuto quando pertinente definiscono lo stile dei riferimenti.
    Il nome Modern Minimalism conserva questa grammatica.
  Canvas:
    Ratio: '4:5'
    Output: Single flat full-bleed typography-only quote card
    Native Reference Ratio: Approximately 5:7, excluding presentation borders
    Adaptation: ricomporre le fasce e gli a capo; non tagliare né stirare il poster
  Mood:
  - Editoriale
  - Rigoroso
  - Monumentale
  - Essenziale
  - Modernista
  Color Palette:
    Fixed Colors: false
    Roles:
    - background
    - quote
    - emphasis
    - secondary
    - rules
    Logic: Una campitura dominante e due ruoli di testo differenziati per luminanza. Il secondo registro è
      più grande e visivamente più forte; le tinte possono cambiare liberamente.
    Contrast Targets:
      main_text_vs_background: 4.5
      secondary_vs_background: 4.5
      note: obiettivi progettuali prudenti; verificare colori effettivi e scala d'uso
    Overrides: Cambiare liberamente le tinte mantenendo contrasto netto, leggibilità e ruoli cromatici.
  Typography:
    Primary:
      classification: sans-serif lineare, pulito e contemporaneo; non condensato artificialmente
      original_font_identified: false
      production_font_file: references/styles/grottesco-editoriale-doppia-lettura/impaginatore/fonts/Archivo-VF.ttf
      production_font_sha256: 0e094a7d3c7c4c25cf1310c4b30014f1dae9332220b1c2c88f4fa996f0b05053
      production_note: Archivo Bold 700, width 100, is the selected production font; the font of the original
        visual references remains unidentified.
      weight: bold o black ottico, circa 700-900 secondo la famiglia
      letterforms: Altezza della x generosa, tratti pieni e uniformi, a a due piani, terminali sobri, curve
        tese, larghezze non geometricamente monolineari.
      case: prevalentemente frase, con maiuscole dettate dal contenuto
      alignment: left
      kerning: metrico con revisione ottica delle coppie critiche
      tracking_em:
        min: 0
        target: 0
        max: 0
      word_spacing_em:
        min: 0.2
        target: 0.24
        max: 0.3
      line_height_em:
        min: 0.88
        target: 0.96
        max: 1.02
      collisions: vietati contatti accidentali, anche fra accenti e discendenti
      scale_within_block: uniforme per tutte le righe dello stesso registro
    Complete Quote:
      font_size_W:
        min: 0.078
        target: 0.095
        max: 0.13
      typical_lines:
      - 3
      - 5
      color_role: quote
    Repeated Excerpt:
      optional: false
      use: 'Secondo registro strutturale predefinito: estratto continuo e letterale scelto dalla citazione,
        ripetuto molto più grande. Ometterlo soltanto per una richiesta esplicita incompatibile o dopo aver
        segnalato un conflitto concreto.'
      font_size_W:
        min: 0.13
        target: 0.16
        max: 0.185
      ratio_to_full_quote:
        min: 1.3
        target: 1.6
        max: 1.85
      typical_lines:
      - 2
      - 4
      color_role: emphasis
      break_logic: unità di senso, sagoma irregolare intenzionale e peso visivo complessivo
    Serif Italic Accent:
      optional: true
      default: false
      status: Variante approvata visivamente in MR2, attiva su richiesta; la versione interamente sans-serif resta disponibile.
      selection: Scegliere una sola parola significativa della citazione, oppure usare quella indicata dall’utente.
      occurrence: Una sola occorrenza, preferibilmente nell’estratto ingrandito; non cambiare automaticamente entrambe le letture.
      treatment: Serif editoriale in corsivo autentico, con grazie riconoscibili; niente semplice inclinazione della sans-serif.
      hierarchy: La sans-serif resta dominante nei due blocchi. Accordare altezza ottica e peso della parola serif al registro vicino, preservando il rapporto di scala fra citazione ed estratto.
      spacing: Spaziatura naturale, baseline ottica coerente e spazio per aggetti corsivi e punteggiatura; niente compressione o tracking arbitrario.
      invariants: Conservare testo letterale, doppia lettura, asse sinistro comune, griglia a quattro colonne e contrasto netto. Nessun altro cambio di font decorativo.
      production: Nel renderer usare un vero file serif italic e misurarne le metriche; i font attualmente inclusi non certificano la disponibilità del corsivo. La prova generativa non garantisce una famiglia esatta.
    Secondary:
      family_mode: serif_editoriale oppure sans_sobrio, scegliere una modalità coerente
      weight: regular
      font_size_W:
        reference_min: 0.011
        social_target: 0.017
        social_min: 0.016
      line_height_em:
      - 1.1
      - 1.3
      tracking_em:
        min: 0
        target: 0
        max: 0
      color_role: secondary
      note: Nei riferimenti il microtesto può essere troppo piccolo per il feed. In 4:5 aumentarne il corpo
        o ridurne la quantità, senza simulare testo.
    Optional Title:
      font_size_W:
      - 0.017
      - 0.023
      treatment: discreto; eventuale nome in corsivo, solo se autentico
    Optional Number:
      font_size_W:
      - 0.115
      - 0.17
      weight: medium fino a black, coerente con il bilanciamento del fondo pagina
      alignment: right
    Production Font:
      Family: Archivo
      Provider: Google Fonts
      Source File URL: https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf
      Specimen URL: https://fonts.google.com/specimen/Archivo
      Local File: references/styles/grottesco-editoriale-doppia-lettura/impaginatore/fonts/Archivo-VF.ttf
      File Base: skill root
      SHA256: 0e094a7d3c7c4c25cf1310c4b30014f1dae9332220b1c2c88f4fa996f0b05053
      Version: '2.001'
      Weight: 700
      Variable Axes:
        wght: 700
        wdth: 100
      License File: references/styles/grottesco-editoriale-doppia-lettura/impaginatore/fonts/Archivo-OFL.txt
      Requirement: Load the actual local file in a deterministic renderer and verify its hash and axes. A font
        URL in an image-generation prompt alone does not guarantee application.
    Production Secondary Font:
      Family: Libre Caslon Text
      Provider: Google Fonts
      Source File URL: https://raw.githubusercontent.com/google/fonts/main/ofl/librecaslontext/LibreCaslonText%5Bwght%5D.ttf
      Specimen URL: https://fonts.google.com/specimen/Libre+Caslon+Text
      Local File: references/styles/grottesco-editoriale-doppia-lettura/impaginatore/fonts/LibreCaslonText-VF.ttf
      File Base: skill root
      SHA256: c11809dbfd5445886293d89b32bfc2584075c80e77750cf1c284113e36b8b3f4
      Version: '2.000'
      Weight: 400
      Variable Axes:
        wght: 400
      License File: references/styles/grottesco-editoriale-doppia-lettura/impaginatore/fonts/LibreCaslonText-OFL.txt
      Requirement: Load the actual local file in a deterministic renderer and verify its hash and axes. A font
        URL in an image-generation prompt alone does not guarantee application.
    Attribution:
      Required: false
      Content: Nome fornito dall’utente o verificato nella fonte, conservato esattamente; nessun titolo o prefisso
        aggiunto.
      Visual Priority: 'Secondaria: corpo inferiore e peso visivo minore rispetto alla citazione e all’eventuale
        estratto; mantenere contrasto e leggibilità.'
      Style: Sans-serif sobria o registro secondario coerente con il profilo, con peso regolare; non adottare
        l’enfasi del testo principale.
      Placement: Modulo inferiore della griglia dopo i due blocchi, con spazio di separazione; nome allineato
        a destra sull'asse della quarta colonna.
      Absent: Omettere e ricomporre il layout, senza segnaposto o spazio vuoto riservato.
      font_size_W:
        min: 0.019
        target: 0.023
        max: 0.03
        note: intervallo di progetto, da adattare alla lunghezza del nome e alla scala finale; non una certificazione
          di leggibilità
  Layout:
    units: frazioni della larghezza W e dell'altezza H dell'asset, non dello screenshot
    columns: 4
    grid_usage: Griglia editoriale a quattro colonne come struttura di allineamenti e filetti. L’assenza di
      microtesti non elimina l’asse comune o la relazione fra i due blocchi principali.
    equal_columns: true
    margin_x_W:
      min: 0.036
      target: 0.055
      max: 0.075
    margin_top_H:
      min: 0.02
      target: 0.045
      max: 0.065
    margin_bottom_H:
      min: 0.035
      target: 0.05
      max: 0.08
    gutter_W:
      min: 0.015
      target: 0.025
      max: 0.035
    equation: column_width = (W - 2 * margin_x - 3 * gutter) / 4
    anchors:
      left: inizio della prima colonna, comune a citazione completa ed estratto ingrandito
      right: fine della quarta colonna, limite massimo e non obiettivo di ogni riga
    spans:
      header_item: 1
      full_quote: 4
      emphasis: 4
      footer_item: 1
      optional_number: ultime 2 colonne, allineato a destra
    vertical:
      approach: Due fasce principali in flusso, con frase completa sopra ed estratto ingrandito sotto. Header
        e footer si ricompongono quando mancano testi pertinenti; le finestre sono indicative, non scatole
        da riempire.
      header_end_H:
      - 0.08
      - 0.16
      full_quote_start_H:
      - 0.1
      - 0.18
      full_quote_end_H:
      - 0.35
      - 0.49
      emphasis_start_H:
      - 0.43
      - 0.52
      emphasis_end_H:
      - 0.76
      - 0.81
      footer_start_H:
      - 0.8
      - 0.85
      gap_between_main_blocks_H:
      - 0.015
      - 0.075
      conflict_resolution: 'Applicare in ordine: testo fedele, assenza di collisioni, rapporto di scala, a
        capo sensati, finestre indicative. Le fasce non devono sovrapporsi.'
    grid_required: true
    fixed_column_count: true
  Graphic Elements:
    Rules:
      optional: true
      thickness_W:
      - 0.0012
      - 0.0022
      geometry: filetti orizzontali sottili, con estremi allineati alla griglia
      header_variants:
      - sotto_ogni_colonna
      - sopra_due_moduli_da_due_colonne
      footer_variants:
      - intero_blocco
      - due_moduli_da_due_colonne
    Dots:
      optional: true
      diameter_W:
      - 0.016
      - 0.026
      count_per_group:
      - 2
      - 3
      gap_in_diameters:
      - 0.25
      - 0.45
      alignment: partenza di una colonna, stesso ritmo nell'intera card
      meaning: nessun significato originario dedotto; usare come segno seriale facoltativo
    Optional Elements:
    - titolo editoriale discreto sopra l'apparato
    - microtesti contestuali in alto e in basso
    - filetti modulari
    - gruppi di pallini
    - numero di serie
    - serif nei testi piccoli
  Imagery:
    Mode: Typography-only; letterforms provide the visual mass
    Presentation Border: Excluded from artwork; never reproduce the grey outer mockup border
  Effects:
    Surface: Perfectly uniform digital flat color
    Texture: None
    Shadows: None
    Depth: None
    Distortion: None; retain natural letter proportions
  Rules:
  - 'Due blocchi tipografici principali allineati allo stesso asse sinistro: frase completa sopra, estratto
    letterale ingrandito sotto.'
  - L’estratto è più grande del testo completo e usa un ruolo cromatico distinto. La doppia scala è strutturale
    anche con una citazione breve.
  - La frase completa compare una volta; il secondo blocco ne ripete intenzionalmente soltanto un estratto
    significativo. Non trattare questa ripetizione come testo spurio.
  - Una stessa famiglia sans-serif lineare domina i due registri, con corpo uniforme e proporzioni naturali.
    Solo nella variante Serif Italic Accent è ammessa una singola occorrenza serif corsiva, accordata otticamente
    alla scala del registro; questa eccezione non elimina la doppia lettura.
  - Nessun tracking arbitrario, giustificazione forzata o deformazione orizzontale dei glifi.
  - Interlinea compatta ma leggibile, senza contatti accidentali fra lettere, accenti o discendenti.
  - Griglia a quattro colonne, filetti sottili ed eventuale apparato minuto ordinano gli allineamenti; numeri
    e pallini sono facoltativi.
  - Fondo uniforme, senza texture, sfumature, fotografie o volume.
  - Microtesti soltanto se pertinenti e disponibili o espressamente richiesti; niente biografie, dati o attribuzioni
    inventati. La loro assenza richiede ricomposizione, non la riduzione a un solo blocco.
  Exclusions:
  - deformare o comprimere singole righe per farle entrare
  - giustificare ogni riga o scalarla a una larghezza identica
  - usare virgolette giganti come decorazione
  - centrare i blocchi principali
  - introdurre font display geometrici, calligrafici o decorativi
  - riempire gli spazi con biografie, dati o attribuzioni inventati
  - conservare un buco riservato a un elemento opzionale assente
  Content Contract:
    required:
    - quote
    emphasis:
      required: true
      use: Seconda lettura strutturale predefinita
      selection: scegliere autonomamente un estratto continuo, significativo e letterale della citazione
      line_breaks: possono cambiare senza cambiare parole, accenti e punteggiatura
      repetition: 'intenzionale: il secondo registro ripete una parte della frase completa, non una seconda
        citazione inventata'
      if_unusable: segnalare il conflitto con un vincolo esplicito o con la capienza; non trasformare silenziosamente
        lo stile in un singolo blocco generico
    author:
      required: false
      absent: omettere senza Anonimo, segnaposto o nomi ricavati dai riferimenti
      source: fornito dall’utente oppure verificato nella fonte; mantenere internamente distinta la provenienza
      render: nome esatto in un registro subordinato; nessuna qualifica o attribuzione dedotta dall’esempio
    editorial_text:
      required: false
      rule: solo contenuto pertinente disponibile o esplicitamente composto per la card
      absent: ridurre l'apparato e ricomporre lo spazio, senza pseudo-microtesto
    series_number:
      required: false
      absent: nessun segnaposto e nessuna riserva di spazio obbligatoria
  Adaptation Rules:
    short_quote: Conservare frase completa ed estratto ingrandito, anche con circa sei parole come nel secondo
      esempio del catalogo. Scegliere un estratto breve e significativo, ricomporre le fasce e mantenere una
      differenza di scala visibile; non inventare una seconda frase.
    long_quote: Ridistribuire gli a capo e ridurre uniformemente il corpo del registro completo, conservando
      l’estratto ingrandito. Se testo fedele, assenza di collisioni e gerarchia non possono convivere nel formato,
      segnalare il conflitto prima di eliminare la seconda lettura.
    long_word: provare altri a capo, poi un corpo minore per tutto il blocco; mai deformare la parola
    missing_microtext: togliere le relative righe e ridurre la fascia editoriale
    missing_number: riequilibrare il fondo pagina con spazio o moduli esistenti
    missing_dots: non sostituirli con altri ornamenti
  Validation:
    hard_checks:
    - Frase completa identica al contenuto approvato.
    - Estratto letterale e continuo, ignorando i soli ritorni a capo, presente come secondo blocco salvo richiesta
      esplicita incompatibile.
    - Nessuna attribuzione, numero o testo spurio.
    - Nessun taglio, stiramento o collisione delle lettere.
    - Rapporto reale del file misurato, con scostamenti dichiarati.
    visual_checks:
    - Due registri chiaramente riconoscibili per dimensione anche senza colore.
    - Asse sinistro comune fra frase ed estratto; il secondo registro è sensibilmente più grande.
    - Sans-serif dominante e corpo uniforme entro ciascun blocco; solo l’accento serif italic facoltativo
      può cambiare famiglia, in una singola occorrenza e con scala ottica coerente. Griglia e filetti condividono gli allineamenti.
    - Nessun obbligo di portare tutte le righe al bordo destro.
    - Microtesti leggibili a dimensione finale oppure ridotti o rimossi.
    - Numero e pallini non indispensabili alla riconoscibilità.
    minimum_followup_tests:
    - frase molto breve
    - parola italiana lunga con accenti
    - frase di circa trenta parole
    - altra palette con ruoli di luminanza conservati
    - assenza completa di numero e pallini
  Reproducibility:
    generative: coerenza di linguaggio da verificare, non identità geometrica
    deterministic: Richiede un impaginatore, il file del font fissato per versione, le metriche, gli a capo
      approvati e un motore di rendering stabile.
    numerical_values: intervalli operativi derivati da stime visive, non misure del file sorgente
  Known Uncertainties:
  - font originale e sua versione esatta
  - valori originali di corpo, tracking, interlinea e margini
  - significato originario dei gruppi di pallini
  User Overrides:
    Palette: Replace colors freely while retaining readable luminance roles.
    Number: Optional; omission must not leave a placeholder.
    Dots: Optional; omission requires no substitute ornament.
    Supporting Text: Optional, meaningful and available; never simulate microtext.
    Font: A supplied font takes precedence. Recheck fit, hierarchy and line breaks using its real metrics.
    Serif Italic Accent: Attivare soltanto su richiesta o per una variante dichiarata, selezionando una parola significativa e una sola occorrenza.
  Production:
    Preferred Mode: hybrid
    Reason: ImageGen genera la card completa con frase, estratto ingrandito e griglia editoriale. Se occorre
      correggere il testo, l’impaginazione con Archivo locale può offrire metriche e allineamenti controllabili
      senza ricostruire da zero il disegno generato. La doppia lettura resta il nucleo predefinito.
    Content Adaptation: Adattare gli a capo e i corpi per conservare i due registri. Numeri, pallini e microtesti
      possono mancare. Se un vincolo esplicito o la capienza impedisce la doppia lettura, dichiarare il conflitto;
      se il file Archivo manca, dichiarare il sostituto e rimisurare.
    Required Capabilities: ImageGen per la composizione completa. Per un'eventuale correzione tipografica,
      caricare il font locale e verificarne hash e assi; comporre su griglia relativa, mantenere i corpi
      uniformi per blocco e misurare glifi e collisioni. La variante serif italic corretta con un renderer
      richiede un file corsivo autentico e composizione di run misti sulla stessa baseline.
    Current Prototype: Il prototipo ha testo con file font reale, box, allineamento e fit uniforme, ma non
      interpreta il profilo né valida automaticamente il contratto dell'estratto o il contrasto.
    Validation Status: Nucleo originale ripristinato dopo il confronto con i primi due esempi e il backup precedente
      alla rinomina. MR1 recupera la doppia lettura su una frase di sei parole ed è stata ritenuta accettabile
      dall’utente. M1–M4 e ML1/ML2 usavano il profilo generalizzato precedente. La gerarchia dell’attribuzione
      è stata verificata nei prompt con e senza nome; non ancora in una nuova immagine.
  Version: 0.1.3

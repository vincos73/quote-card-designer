Design Style:
  Canvas:
    Ratio: '4:5'
    Output: Single full-bleed quote card
    Adaptation: Recompose for the requested ratio; do not stretch or crop the source poster.
  Color Palette:
    Fixed Colors: false
    Roles:
    - background
    - primary ink
    - inverse ink
    - optional accent
    Strategy: Choose colours per quote; preserve strong local contrast. Monochrome references do not require
      monochrome output.
  Content Contract:
    quote: Preserve supplied words, case, accents and punctuation; show once.
    author: Optional supplied or source-verified name, exact and smaller/lighter than quote; omit without placeholder.
    supporting_text: Only supplied or explicitly requested content; never invent labels, microcopy, numbers,
      dates, UI menus, barcodes or authors from the references.
  User Overrides:
    Format: Recompose rather than scale the whole poster.
    Palette: Freely variable by compositional roles.
    Font: Use requested actual font when available; natural metrics and word spacing. Exact font identification
      from references is unverified.
  Validation:
    Status: Development revision 0.2.0. EC1 remains the historically approved example. EC2 received
      positive user feedback; after EC3 the user accepted the direction and requested candidate status
      in the online gallery. EC3 tests a longer sentence, a different accent colour and a rotated
      selected word. Two examples do not establish repeatability.
    Required Followup:
    - a long quotation beyond the two short and medium calibration sentences
    - a substantially different palette beyond the tested blue and orange accents
    - optional attribution
    - native font identity and exact interface geometry remain unverified
  Name: Editor Canvas
  Status: "Included in distributed version 0.5.0; promoted from the development candidates on 29 October 2026."
  Concept: A close crop of a contemporary design editor catches the quotation at a meaningful instant
    of work. One word or letter is the object of a specific editing operation, so the interface participates
    in the meaning instead of decorating a finished poster. Monumental typography is contrasted with
    small, coherent tools, an artboard edge and a quiet surrounding workspace. Realism comes from the
    relation between the selected object, the tool and its geometry, not from adding more interface chrome.
  Mood:
  - graphic
  - precise
  - decisive
  - work in progress
  - contemporary
  Typography:
    Primary: Large bold proportional grotesque with substantial mass and clearly drawn counters;
      no obligation to use a specific font, monospace or pixel letters.
    Hierarchy: One reading sequence. An actively edited word may change scale or colour for a clear
      expressive reason; all supporting lines retain a consistent register. The word is never duplicated
      as a separate decorative object.
    Spacing: Preserve natural glyph proportions, optical kerning and distinct word spaces at feed size.
      Fit longer lines by rebreaking or scaling the relevant register uniformly, never squeezing individual
      words or eliminating spaces. Allow accents and control points room to breathe.
    Attribution: Optional supplied name, exact, smaller and lighter than the quote, right-aligned to
      a clear right edge of the artboard or text block. Never present it as an invented UI footer.
  Layout:
    Structure:
    - Tight crop into a large artboard; the quote occupies the main visual area and remains entirely visible
    - A narrow portion of the surrounding workspace and one cropped tool rail establish context
    - One main editing operation, attached to an actual word or glyph rather than scattered selections
    - An optional compact contextual strip or cropped properties area occupies genuinely unused space
    - Ruler ticks and at most a few guides refer to the text or artboard geometry
    - One cursor can approach the relevant node, handle or object without obscuring the lettering
    Adaptation: Choose the crop, reading axis, active fragment and amount of visible interface for each
      quotation. Do not require four lines, a particular word, a left toolbar or the calibration palette.
      Longer quotations need more artboard and fewer controls before a smaller type size.
    Relation To Retro UI: Editing controls relate directly to letters, not a main retro desktop window containing
      the quote.
  Graphic Elements:
    Repertoire:
    - Fine vector contours exactly following a selected glyph, with small nodes attached to the contour
    - Thin selection bounds with small handles at actual corners and midpoints when object selection is active
    - Ruler ticks without numbers and alignment guides anchored to real edges
    - Small coherent icons for direct selection, pen, shape, alignment and colour
    - A few solid colour swatches and compact panel divisions
    - A single flat cursor with a keyline legible against the local background
    Operation: Choose one credible editing state. Contour editing can show a path and attached nodes
      before any anchor is selected, without tangent handles. Object selection can show one bounding box.
      Do not combine contradictory states simply to increase visual density.
    Geometry: If tangent handles are used, they must originate at an actual selected anchor, follow the
      local curve tangent and remain attached. Prefer the simpler node-only state when this geometry
      cannot be rendered reliably. No floating control lines.
    Selection: Use enough context to recognize the workspace while keeping the sentence primary.
      Crop peripheral UI rather than shrinking a whole application into the card. No pseudo-labels or
      short strokes that imitate unreadable interface text.
  Effects:
    Surface: Crisp native digital rendering; flat artboard and low-contrast neutral application surfaces.
    Depth: Planar layering, with only a small restrained shadow under a genuinely floating tool panel.
    Shadows: No extrusion, bevelled icons, physical paper shadows or dramatic light on the letters.
    Selection: Use a clearly legible control accent independent of the artwork palette. A selected word
      can carry that colour, but its fill and counters must preserve readability.
  Rules:
  - Show a specific editing action related to the quotation; a generic selection frame alone is insufficient.
  - The artboard and its controls form the card itself; do not photograph a monitor or add a desk mockup.
  - Keep one active object and a coherent tool state; multiple toolbar icons do not imply multiple active cursors.
  - Frames and nodes follow actual text geometry; remove an unreliable optional detail instead of disguising it.
  - Do not copy NEW/LOAD/SAVE labels, creator handles or reference wording; do not invent readable UI labels.
  - Small non-verbal controls, ruler ticks, swatches and panel divisions may add realism without fabricated copy or data.
  - Handles and cursor must not cover accents, punctuation or letters.
  - Preserve strong local contrast and visibly separate words at the final viewing size.
  - The calibration example is not a mandatory layout, palette, quoted text or operational image reference.
  Production:
    Preferred Mode: typeset
    Composition: Generate the entire new card with ImageGen, including the quotation and interface.
      The mode describes possible refinement, not permission to replace full-card generation with a script.
    Required Capabilities:
    - measured text bounds
    - mixed text/background runs
    - precise contours, attached nodes, guides and cursor geometry
    - layer order and local contrast
    Implemented: Not implemented as a profile-aware renderer; geometry is suitable for deterministic layout.
  Version: 0.2.0

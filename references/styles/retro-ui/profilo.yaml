Design Style:
  Name: Retro UI
  Status: Revisione bitmap approvata dall'utente il 26 ottobre 2026
  Concept: >
    La frase diventa il contenuto di un desktop bitmap: finestre attive e
    inattive, barre a righe, retini, cursori e piccole immagini cooperano
    alla sua lettura. Il carattere nasce dai dettagli delle prime interfacce
    grafiche, reinterpretati come quote card contemporanea; non è una
    ricostruzione certificata di un sistema operativo specifico.
  Canvas:
    Ratio: '4:5'
    Type: Quote card raster completa
    Adaptation: Ricomporre finestre e contenuti per il formato richiesto.
  Mood:
    - Nostalgic
    - Personal
    - Quietly playful
    - Graphic
    - Tactile digital
  Color Palette:
    Fixed Colors: false
    Roles:
      Desktop: Campo continuo che collega le finestre e lascia pause visive.
      Content: Superficie calma e distinta per la frase.
      Ink: Contrasto forte per lettering, bordi e pittogrammi.
      Selection: Un eventuale accento per uno stato o un dettaglio scelto.
    Directions:
      Monochrome: >
        Nero e bianco; mezzi toni simulati da retini regolari di pixel,
        senza un velo grigio sopra tutta la card.
      Pastel desktop: >
        Crema e una tinta morbida per il desktop, inchiostro scuro,
        un accento limitato. Una campitura ondulata può differenziare
        sfondo e pannelli senza introdurre gradienti o vetro.
    Rules:
      - Scegliere i ruoli dal tono della frase e dalle preferenze dell'utente.
      - La variante pastello è una rilettura contemporanea, non una pretesa storica.
      - Non imporre sempre menta, rosa o il desktop nero degli esempi.
      - Tenere il campo immediatamente dietro al testo uniforme e leggibile.
  Typography:
    Quote:
      Style: >
        Lettering derivato dai caratteri bitmap di sistema, con gradini
        intenzionali e controforme aperte. Può essere proporzionale o
        monospaziato: il monospace non è un requisito dello stile.
      Weight: Sostanziale, coerente con la scala di lettura della card.
      Hierarchy: >
        La frase è il primo livello visivo. I connettivi restano leggibili
        e appartengono al percorso principale, non a microetichette UI.
      Spacing: >
        Spazi fra parole e ritmo ottico regolari; nessuna parola schiacciata
        o allargata per entrare in una finestra.
    Attribution:
      Condition: Solo se fornita o verificata nella fonte.
      Treatment: Più piccola e quieta della frase, allineata a un asse destro utile.
      Absence: Ricomporre lo spazio senza segnaposto.
  Layout:
    Principle: >
      Progettare una scrivania con gerarchia, non incollare cornici intorno
      a una citazione generica. Frase, finestra attiva e finestre secondarie
      devono condividere bordi, sovrapposizioni e ordine di lettura.
    Relations:
      - Una superficie attiva o una sequenza chiaramente collegata ospita il testo.
      - Finestre di scala diversa creano un fronte e un retro riconoscibili.
      - Le sovrapposizioni attraversano margini liberi, mai parole necessarie.
      - Il desktop resta visibile in pause e intervalli, senza riempire ogni spazio.
      - Barra titolo, corpo e controlli sono distinguibili per funzione e peso.
    Adaptation: >
      Per frasi lunghe ampliare il contenuto e togliere utility secondarie
      prima di ridurre il testo. Non obbligare ogni card allo stesso grande
      rettangolo centrale né alla stessa coppia di finestre.
  Elements:
    Interface grammar:
      - Barre titolo a righe sottili, piccoli controlli coerenti e bordi doppi.
      - Scroll bar con frecce e cursore, angoli di ridimensionamento, selezioni tratteggiate.
      - Cartelle, documenti e utensili riconoscibili disegnati con economia di pixel.
      - Cursore freccia o puntatore di selezione in posizione plausibile.
      - Poche utility senza testo, scelte in rapporto al significato e alla composizione.
    Imagery:
      Treatment: >
        Disegni bitmap, ritagli trattati a retino o piccole metafore visive
        dentro una finestra. Una sola immagine significativa può bastare.
      Selection: >
        Scegliere il soggetto in base alla frase. Luna, germoglio e cartella
        degli esempi sono scelte delle prove, non mascotte obbligatorie.
    Consistency: >
      Usare una logica di controlli coerente nella singola card. È possibile
      reinterpretare convenzioni di epoche diverse, senza dichiarare una
      schermata storicamente esatta né accumulare controlli casuali.
  Effects:
    Pixel: Contorni scalettati nitidi, passo visivo coerente, senza sfocatura artificiale.
    Dither: Trame ordinate o stipple controllato per tono e profondità di immagini e stati.
    Shadow: Piccolo scarto netto per separare livelli; evitare grandi lastre nere decorative.
    Texture: Eventuale traccia di stampa leggera, senza usura imposta o sporco uniforme.
    Gradients: Nessuno nel registro ordinario.
  Content Contract:
    quote: Conservare parole, maiuscole, accenti e punteggiatura; mostrare la frase una volta.
    author: Facoltativo, letterale, subordinato e allineato a destra; non inventarlo.
    personal_signature: >
      Solo su richiesta esplicita dell'utente. Conservare il nome esatto e
      distinguere la firma personale dall'autore della citazione; non
      ricavarla dal profilo dell'utente. Registro subordinato sull'asse destro.
    Interface copy: >
      Nessun testo di riempimento. Barre e utility possono usare solo segni
      e pittogrammi; etichette o menu testuali richiedono contenuto fornito
      o esplicitamente richiesto. La citazione resta l'unica prosa ordinaria.
  Rules:
    - La card deve leggere prima come frase e poi come piccolo mondo desktop.
    - I dettagli bitmap devono caratterizzare il disegno, non ridursi al solo font.
    - Non certificare una famiglia di font o una griglia pixel esatta dalla sola immagine.
    - Evitare loghi, marchi di software, date, clock, metadati e nomi inventati.
    - Evitare vetro, cromo, glow, lens flare e interfacce fantascientifiche.
    - Non trasformare la card in un inventario di icone o in un mockup di dispositivo.
    - La variante monocromatica conserva il contrasto anche senza accenti cromatici.
  Production:
    Preferred Mode: generative
    Method: >
      ImageGen integrato per l'intera composizione, inclusi testo, finestre,
      retini e illustrazione. Correzioni generative mirate in caso di errori;
      eventuale rifinitura con font reali solo conservando la base generata.
    Reference Policy: >
      Gli allegati sono riferimenti analizzati e tradotti nel prompt; non
      sono dipendenze operative. Non è stato eseguito un confronto A/B
      controllato per adottare stabilmente immagini di input.
    Validation Status: >
      Revisione approvata dall'utente il 26 ottobre 2026. Due card complete
      con frasi diverse, una monocromatica e una pastello, controllate native
      e a 320 x 400 px. Frasi lunghe, attribuzione e altri formati non ancora
      provati. Una prova riuscita non dimostra ripetibilità. L'utente ha
      richiesto l'aggiornamento della galleria e della skill.
Composition Library: composizioni.yaml

Design Style:
  Name: "Chromatic Type"
  Concept: >
    Typography and transparent overprinting form the image. Flat layers of
    cyan, magenta and yellow intersect letterforms and geometric fields,
    creating new colours like translucent printing inks. The relationships
    between colour, letter strokes and counterspaces define the composition.
  Canvas:
    Ratio: "4:5"
    Output: "Single finished flat editorial quote card, full bleed"
  Mood:
    - Modern
    - Experimental
    - Lucid
    - Airy
    - Editorial
    - Geometric
  Color Palette:
    Background:
      Paper: "White uncoated paper"
    Primary:
      Cyan: "Pure cyan"
      Magenta: "Vivid magenta"
      Yellow: "Bright process yellow"
    Text:
      Black: "Deep near-black"
    Overprints:
      Intersections: "Blue, green, red and a dark overlap"
    Roles: >
      White provides the open field. Cyan, magenta and yellow act as transparent
      ink layers, not opaque stickers. Near-black and coloured letter strokes
      maintain a readable hierarchy. Intersections visibly create secondary
      colours and connect the typography to the geometric fields.
  Typography:
    Primary:
      Style: "Coherent bold proportional grotesk, not condensed poster type"
      Tracking: "Tight but optically adjusted"
      Role: "Large structural words and the strongest phrase"
    Secondary:
      Style: "The same grotesk character at a quieter scale"
      Role: "Introduction and connecting words within the quotation"
    Hierarchy: >
      Choose a dominant word, a quieter introduction and a deliberate change
      of alignment for a connecting phrase. Integrate transparent and near-black
      strokes without losing word recognition. Preserve the original case,
      spelling, punctuation and natural reading sequence.
  Layout:
    Structure:
      - "Asymmetrical editorial composition"
      - "Typography integrated with flat geometric colour fields"
      - "Meaningful whitespace and deliberate geometric rhythm"
      - "A visible relationship between alignments and colour intersections"
    Relationships: >
      Let translucent fields pass through counters or align with letter strokes.
      The geometry and text belong to one optical structure rather than text
      pasted onto coloured rectangles. Shift a selected alignment when it
      supports the phrase's meaning. All words remain unambiguous.
  Graphic Elements:
    Repertoire:
      - "Hard-edged rectangular ink fields"
      - "Circular sectors and related planar geometry"
      - "Transparent coloured letter strokes and typographic counterspaces"
    Selection: >
      Select a few related shapes for the quotation. Their proportions,
      positions and colour intersections should support the typographic rhythm.
      A particular rectangle or circular sector belongs to a card's composition,
      not to every application of the style.
  Effects:
    Texture: "Extremely subtle smooth print texture on white uncoated paper"
    Overprint: "Clearly visible translucent ink intersections"
    Edges: "Flat, crisp and hard-edged"
    Shadows: "None"
    Depth: "Flat ink layering only"
  Rules:
    - "Preserve the quotation verbatim and render it once."
    - "Use colour overlap as the distinguishing signature."
    - "Keep all lettering clearly readable at phone size and within the canvas."
    - "Maintain meaningful whitespace and coherent typographic relationships."
    - "Use only supplied supporting text and supplied or verified attribution."
    - "Avoid gradients, blur, 3D, drop shadows and opaque sticker-like colour panels."
    - "Avoid collage, photographic cutouts, meshes and technical grids."
    - "Do not add repeated words, invented labels, microtext, titles, logos or signatures."
  User Overrides:
    Format: "Recompose the type, geometric fields and their intersections for the requested ratio."
    Palette: "Replace the colours when requested while retaining meaningful transparent overlap and readable contrast."
    Fonts: "Honour the requested type direction while preserving hierarchy and the interaction of strokes and colour."

"Design Style":
  "Name": "Mosaic"
  "Status": "Candidato approvato dall’utente il 29 ottobre 2026; non incluso nella selezione release."
  "Concept": "Lettere e piccola immagine sono costruite da tessere fisiche di mosaico colorato; direzione delle file, fughe e materia seguono il disegno."
  "Canvas":
    "Ratio": "4:5"
    "Output": "Composizione raster completa, testo incluso"
    "Surface": "Mosaico artigianale fotografato quasi frontalmente, tessere e fughe visibili anche nel fondo più quieto."
    "Adaptation": "Ricomporre nel formato richiesto, senza stirare lettere o tagliare parole."
  "Mood":
    - "Materico"
    - "Artigianale"
    - "Fotografico"
    - "Colorato"
  "Color Palette":
    "Policy": "Palette armonica variabile con gerarchia fra lettere colorate, piccola immagine e fondo quieto. Le combinazioni degli esempi non sono obbligatorie. Mantenere contrasto locale."
    "Material": "Colore proprio delle tessere, con riflessi selettivi dello smalto e campi coerenti, senza confetti cromatici uniformi."
  "Typography":
    "Quote": "Lettering geometrico robusto: aste dritte, spessori coerenti, curve semplici e righe prevalentemente orizzontali. Non usare glifi sinuosi, calligrafici o Art Nouveau."
    "Construction": "Le file di tessere costruiscono aste, curve e diagonali; tagli più fini nelle svolte, file ordinate nei tratti dritti. Nessuna sagoma di font riempita con una foto generica di mosaico."
    "Spacing": "Glifi e spazi naturali, kerning ottico. Nessuna deformazione o tracking arbitrario per riempire righe. Preferire a capo e ricomposizione."
    "Attribution": "Facoltativa, esatta, più piccola e quieta, sempre allineata a destra su un asse riconoscibile. Se assente, recuperare lo spazio."
    "Signature": "Solo se richiesta, distinta dall’autore, mai dedotta dal profilo personale."
  "Layout":
    "Hierarchy": "La frase domina; una piccola immagine pertinente al significato resta subordinata e realizzata nello stesso materiale."
    "Relation": "Gli intervalli del testo, il fondo e l’eventuale percorso visivo sono disegnati insieme. I motivi possono curvare nei vuoti senza deformare le lettere."
    "Variation": "Assi, a capo, scala, percorso e soggetto dipendono dalla frase; uccello e germoglio sono esempi, non soggetti fissi."
  "Elements":
    "Primary": "Tessere di ceramica smaltata o smalti vitrei, tagli e fughe irregolari ma coerenti, piccoli bordi scheggiati."
    "Secondary": "Una piccola immagine o simbolo scelto dal senso della frase; eventuale percorso di tessere o vetri come relazione compositiva, non ornamento obbligatorio."
  "Effects":
    - "Luce naturale radente, piccole ombre nelle fughe e riflessi selettivi sulle tessere."
    - "Superfici prevalentemente planari, smalti variabili, piccole irregolarità e grana realistica della malta."
    - "Niente tasselli gonfi da CGI, bevel uniforme o texture piatta stampata."
  "Rules":
    - "Lettering geometrico e materiale fisico sono invarianti."
    - "La frase resta completa e leggibile; nessuna parola tagliata o deformata per far spazio all’immagine."
    - "Niente soggetto, palette, numero di righe o percorso decorativo obbligatorio."
    - "Niente pixel art, griglia digitale perfetta, font stampato sulla superficie o texture generica incollata nelle lettere."
  "Content Contract":
    "quote": "Testo completo una volta, parole, cassa richiesta, accenti e punteggiatura conservati. Le frasi originali degli esempi sono senza punto finale."
    "other_text": "Nessun autore, firma, titolo, logo o dato di riempimento inventato."
  "Production":
    "Method": "ImageGen integrato per la composizione completa, testo incluso. Nessun testo impaginato deterministicamente sopra un fondo generato."
    "Reference Inputs": "Le revisioni storiche usano prove precedenti come target di edit; non sono immagini operative obbligatorie per il futuro."
    "Validation": "Due frasi originali in due composizioni rilette visivamente, con lettering geometrico e immagine secondaria. Nativi 1122×1402 px, prossimi al 4:5. Font esatto, contrasto numerico, fattibilità costruttiva, attribuzioni e ripetibilità non certificati."
"Composition Library":
  "Style Name": "Mosaic"
  "Selection":
    "Basis": "Scegliere la relazione fra parole, piccola immagine e direzione del materiale dal senso e dalla lunghezza della frase."
    "Variation": "Repertorio aperto; colore e soggetto non sostituiscono la variazione compositiva."
  "Families":
    -
      "id": "geometric-rows-small-sign"
      "Name": "Righe geometriche e segno piccolo"
      "Use When": "La frase si articola in gruppi compatti e una figura secondaria può occupare un’apertura."
      "Structure": "Righe dritte a larghezza naturale; piccola immagine in un vuoto contiguo, realizzata nello stesso materiale."
      "Text Adaptation": "A capo per gruppi di senso, spazi naturali e margini completi."
      "Format Adaptation": "Ricomporre masse e intervalli nel formato richiesto; attribuzione eventuale allineata a destra."
    -
      "id": "path-between-words"
      "Name": "Percorso fra le parole"
      "Use When": "Il significato può essere sostenuto da una traiettoria che collega più gruppi."
      "Structure": "Un percorso di tessere o vetri attraversa i vuoti e conduce al piccolo soggetto; le lettere restano geometriche e i gruppi su assi chiari."
      "Text Adaptation": "Separare parole troppo vicine cambiando a capo; non piegare o schiacciare i glifi."
      "Format Adaptation": "Modificare numero di gruppi, tragitto e posizione del segno per il rapporto richiesto."
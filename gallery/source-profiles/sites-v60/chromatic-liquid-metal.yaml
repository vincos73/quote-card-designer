Design Style:
  Name: Chromatic Liquid Metal
  Concept: 'A futuristic editorial quote-card language pairs monumental deep-cobalt Swiss-geometric
    typography with sculptural liquid forms that transition between mirror chrome and transparent
    refractive glass. Sparse prismatic reflections animate a clean near-white field. The visual
    tension comes from the collision of rigid typographic mass and fluid material, with intentional
    overlap, generous negative space and a clear reading sequence.

    '
  Canvas:
    Ratio: '4:5'
    Output: Single finished vertical quote card, full bleed
  Mood:
  - Futuristic
  - Editorial
  - Experimental
  - Brutalist
  - Premium
  - High-Tech
  - Bold
  - Minimal
  Color Palette:
    Background:
      NearWhite: '#FAFAFA'
    Primary:
      ElectricBlue: '#14266F'
    Secondary:
      Black: '#111111'
      LightGray: '#E8E8EA'
    Material:
      ChromeSilver: '#E6E8EF'
    Accent:
      IceCyan: '#A6F6FF'
      PrismPink: '#F4B6FF'
      PrismCyan: '#A6F9FF'
    Roles: 'Near-white is the continuous background. Deep cobalt blue carries the quotation
      and the strongest graphic mass. Silver, dark mirror bands and pale grey describe chrome.
      Cyan and pink appear as local optical interference or refracted light within the objects,
      not as a rainbow background. Black is optional supporting contrast.

      '
  Typography:
    Primary:
      Style: Ultra-bold broad Swiss grotesk, normal-to-wide proportions, not condensed
      Weight: Black
      Scale: Monumental, close to the width of the card
      Tracking: Tight, with clear letter separation
      Color: '#14266F'
      Case: Uppercase explicitly requested for this variation
    Secondary:
      Style: Medium Swiss sans-serif
      Role: Only supplied attribution or supporting copy, if present
    Hierarchy: Build a monumental uppercase typographic block using broad, heavy letterforms.
      Reflow freely to keep the complete quotation legible inside the frame. Use scale and placement
      for poster impact and preserve ample white intervals.
  Layout:
    Structure:
    - Asymmetric editorial composition with a strong vertical rhythm
    - Large blue typographic mass and one dominant fluid material gesture
    - Selective foreground overlap and open white intervals
    Relationships: 'Let the fluid cross a typographic boundary, wrap around an interval or displace
      a small part of the blue letterforms optically. The quotation remains the primary reading
      path. Position overlap near a word edge or in open letter spaces so the material interaction
      does not erase text. Cropping may affect objects at the frame edge; never crop away words,
      punctuation or essential identifying parts of letters.

      '
  Graphic Elements:
    Repertoire:
    - An elongated liquid chrome ribbon or smooth organic folded surface
    - A fluid form transitioning from opaque mirror metal to clear glass
    - A small number of suspended droplets or narrow liquid extensions
    Selection: 'Choose a coherent fluid gesture for the quotation. Vary scale and transparency
      while keeping the composition sparse. Objects are an open repertoire, not an inventory
      to display together on every card.

      '
  Material:
    Surface:
    - Smooth mirror chrome with crisp dark and bright reflected bands
    - Clear glass with visible thickness, rim highlights and strong refraction
    - Continuous organic curvature between metal and transparent regions
    - Restrained cyan and pink interference reflections
    Rendering: 'Photorealistic 3D material rendering on abstract forms. Controlled studio lighting
      describes curves and separates the clear material from white. Chrome must remain metallic
      rather than becoming pastel plastic.

      '
  Effects:
    Refraction: Local bending of blue typography through transparent regions
    Chromatic Aberration: Fine coloured fringes confined to selected glass edges
    Glow: Very subtle highlight bloom within the material
    Shadows: Soft natural contact or proximity shadows where spatially appropriate
    Background: Flat near-white without a gradient or decorative texture
  Rules:
  - Render the supplied quotation once, in the uppercase form explicitly requested, preserving
    every word and punctuation mark.
  - Keep monumental deep cobalt typography and the chrome-glass relationship visually dominant.
  - Maintain a clear reading sequence despite selective overlap and refraction.
  - Use only supplied attribution and supporting text.
  - Do not invent coordinates, numbers, UI labels, captions, logos or decorative microtext.
  - Avoid photography, devices, interface screenshots and product presentation scenes.
  - Avoid cluttered liquid splashes, all-over rainbow gradients and generic glossy bubbles.
  - Keep the card as an editorial composition with limited information and generous white space.
  User Overrides:
    Format: Recompose the typography and fluid gesture for the requested card ratio.
    Palette: Replace colours if requested while retaining typographic contrast and optical material
      separation.
    Fonts: Honour the requested type direction while retaining monumental weight and clear reading.

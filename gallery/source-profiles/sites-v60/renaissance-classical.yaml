Design Style:
  Name: Classical Roman
  Concept: 'A scholarly classical quote-card language draws on Roman inscriptions, classical books, sculpture,
    archaeology and carefully edited exhibition catalogues across the classical tradition. Monumental
    Roman inscriptional serif typography shares a pale parchment page with one substantial sculptural,
    architectural or archival image. Restrained antique gold, quiet materials and generous margins establish
    an elegant book-like hierarchy. The quotation remains the primary message rather than becoming a caption
    to a decorative luxury image.

    '
  Canvas:
    Ratio: '4:5'
    Output: Single finished vertical editorial quote card, full bleed
  Mood:
  - Classical
  - Historical
  - Elegant
  - Luxurious
  - Scholarly
  - Editorial
  - Quiet
  Color Palette:
    Background:
      Parchment: '#F4EFE5'
    Primary:
      NearBlack: '#111111'
      SepiaBrown: '#463B31'
    Secondary:
      PaleStone: '#E1DACE'
      White: '#FFFFFF'
    Accent:
      AntiqueGold: '#A98A43'
    Roles: 'Pale parchment is the continuous page. Near-black or sepia carries the quotation; warm stone
      and restrained white belong to the imagery or its quiet highlights. Antique gold is a small editorial
      accent, never a large shiny surface. Keep these proportions broadly stable across related cards
      while allowing the image and type to be recomposed for each quotation.

      '
  Typography:
    Primary:
      Style: Roman inscriptional capitals with wedge-shaped serifs and classical carved-letter proportions
      Weight: Medium to semibold, with substantial stems and crisp wedge serifs
      Scale: Monumental but spacious inscriptional quotation
      Tracking: Open, optically balanced inscriptional spacing
      Case: Uppercase requested through the Roman/Latin inscriptional direction
      Consistency: Use the same font design, cap height, stroke weight, letter proportions and tracking
        across every line of the quotation. No condensed last line, per-word font substitution or local
        scaling.
    Supporting:
      Style: Old-style serif or restrained Swiss sans-serif
      Weight: Regular to medium
      Role: Only supplied attribution or supporting content
    Hierarchy: Use monumental Roman inscriptional capitals, with dignified broad proportions, wedge serifs
      and moderate stroke contrast rather than a heavy book serif. The quotation is the first reading
      priority. Preserve every word and sentence punctuation in uppercase; omit enclosing quotation marks.
      Set deliberate line breaks and generous optical spacing. Never replace U with V or rewrite words
      into Latin. Resolve collisions by repositioning or scaling the image, changing line breaks, or scaling
      the entire text block uniformly. Never distort or shrink a single line to accommodate the image.
  Layout:
    Structure:
    - An underlying modular editorial grid adapted to a vertical card
    - Generous page margins and purposeful asymmetry
    - Distinct but related typographic and principal image fields
    - One clear visual hierarchy and low information density
    Relationships: 'Give the quotation ample usable width. A substantial selected image occupies a related
      field below or beside it, with the image''s gaze, contour or architectural direction guiding attention
      toward the words. A gentle shared edge or selective cropping can connect the two fields without
      obscuring the quotation. Do not force a narrow two-column slide layout into a vertical card, and
      do not shrink the image into an arbitrary corner ornament. Change the balance with the content while
      keeping the quotation legible and dominant.

      '
  Imagery:
    Subjects:
    - Sculptural fragments and marble studies
    - Classical architecture, temple details and archaeological ruins
    - Historical maps and architectural sketches
    - Manuscript details and material studies of old books
    Selection: 'Select one substantial image related to the quotation. The repertory is open, not an obligation
      to reuse one bust, monument or page. Additional fragments are optional only when they clarify the
      composition. Generated artwork must not imply a verified attribution, date or archive source.

      '
    Treatment:
    - Natural directional light and tactile stone, paper or ink
    - Warm neutral, sepia or restrained monochrome reproduction
    - Clean archival cutout or carefully cropped image field
    - Respectful material detail with soft realistic tonal modelling
    Avoid:
    - Generic glossy luxury advertising and cinematic fantasy scenes
    - Dramatic spotlights, metallic 3D sculpture and synthetic plastic surfaces
    - Dense manuscript text used as invented filler
  Graphic Elements:
    Repertoire:
    - Very fine editorial rules
    - A restrained partial frame aligned to the page structure
    - Small antique-gold line details when compositionally useful
    Role: 'Establish alignment and book-like rhythm without surrounding the card with decoration. Captions,
      folios, seals and labels require supplied content; do not invent them to imitate a catalogue.

      '
  Background:
    Surface: Quiet pale parchment or fine warm uncoated paper
    Texture: Subtle fibres and restrained print ageing
    Restraint: No burnt edges, theatrical stains, scroll mockups or heavy grunge
  Effects:
    Shadow: None or a very soft natural tonal edge within the image
    Texture: Subtle, matte and appropriate to paper, stone and print
    Gold: Flat muted antique-gold ink, not glossy foil or glow
    Depth: Editorial reproduction and natural image modelling, not interface layers
  Rules:
  - Render the supplied quotation once in the requested Roman inscriptional capitals, preserving every
    word and sentence punctuation, without enclosing quotation marks.
  - Prioritise the balance of whitespace, strong Roman-serif typography and one substantial image.
  - Use only supplied attribution and supporting text.
  - Keep parchment, warm neutrals and antique gold restrained and consistent in role.
  - Do not invent titles, historical inscriptions, dates, captions, archive marks or decorative microtext.
  - Avoid generic presentation panels, rounded UI cards, ornate borders and excessive ornament.
  - Vary composition with the quotation and imagery rather than imposing one repeated template.
  - Keep typographic design and scale consistent within the quotation; adapt the image and layout instead
    of compressing an individual word or line.
  User Overrides:
    Format: Recompose the type and imagery for the requested card ratio.
    Palette: Honour requested colours while preserving controlled classical hierarchy and material restraint.
    Fonts: Honour requested typography while retaining scholarly editorial clarity.
    Subject: Honour a requested image subject without enforcing any example's artefact.
  Production:
    Preferred Mode: hybrid
    Reason: La tipografia roman inscriptional e il reperto scultoreo o architettonico hanno ruoli distinti.
      Comporre il testo con un file font reale è più affidabile della generazione della frase dentro l'immagine;
      il visual può essere generato o fornito come immagine originale.
    Content Adaptation: 'Se non è disponibile un font romano adeguato, non dichiarare un match tipografico
      esatto: usare un serif disponibile con nota, oppure generazione completa solo per una bozza, controllando
      ogni parola. Non scaricare font nuovi in questo incarico.'
    Required Capabilities: File tipografico romano effettivamente disponibile, composizione dei capilettera
      misurata, immagine ritagliabile, griglia asimmetrica e accento oro piatto; niente deformazione locale.
    Current Prototype: Supporta font locale, testo e immagine separata ma non verifica se il font abbia
      le proporzioni inscriptional richieste. Non installare o scaricare un font senza autorizzazione;
      usare solo asset già disponibili.
    Validation Status: Profilo non renderizzato nei tre test odierni. Font adatto e fedeltà del registro
      romano non sono stati verificati.

Design Style:
  Name: "Digital Textile"
  Concept: >
    Computational textile design treats a quotation as a woven graphic system.
    Clear geometric lettering, jacquard-like interlacing and structured yarn
    paths create a tactile contemporary surface. The pattern emerges from
    warp, weft and typography rather than decorative folklore.
  Canvas:
    Ratio: "4:5"
    Output: "Single finished flat editorial quote card, full bleed"
  Mood: ["Tactile", "Computational", "Warm", "Graphic", "Structured"]
  Color Palette:
    Background:
      Ecru: "#E8E1D2"
    Primary:
      Ultramarine: "#253DAD"
    Accent:
      Vermilion: "#DD4A32"
    Contrast:
      Ink: "#20272E"
    Roles: >
      Ecru creates a quiet woven ground. Ultramarine carries strong letter
      shapes and the main thread system. Vermilion marks one meaningful
      crossing or displaced edge. Ink can support quieter readable words.
  Typography:
    Primary:
      Style: "Bold geometric sans-serif built from closely woven yarn shapes"
      Role: "Dominant quotation words with solid, clearly readable interiors"
    Secondary:
      Style: "Simpler woven sans-serif at a quieter scale"
      Role: "The connecting quotation words"
    Hierarchy: >
      Preserve the original case and punctuation. Thread texture must remain
      finer than the letter strokes; avoid a coarse pixel matrix that makes
      words hard to recognize. Use clear scale differences and calm spacing.
  Layout:
    Structure:
      - "Flat textile field with precise editorial alignments"
      - "An ordered weave disrupted at a meaningful transition"
      - "Open woven ground around the quotation"
    Relationships: >
      Letter strokes and background threads belong to one material system.
      A few yarn paths may change direction or cross the field boundary to
      support the words. The quotation is the main pattern, not an overlay
      on a busy decorative cloth.
  Elements:
    Repertoire: ["Warp and weft crossings", "Jacquard-like lettering", "Selected loose thread paths", "A displaced woven edge"]
    Selection: "Use a small coherent set of weave frequencies and thread directions."
  Effects:
    Texture: "Fine, visibly interlaced matte yarn with restrained fibre detail"
    Depth: "Shallow textile relief only, near-orthographic flat presentation"
    Light: "Soft even light preserving the graphic composition"
  Rules:
    - "Render the exact quotation once, preserving legibility at phone size."
    - "Keep the weave tactile and credible while maintaining clean typographic shapes."
    - "Avoid photographed room scenes, rugs on floors, decorative fringe and craft-shop mockups."
    - "Do not add invented stitching labels, signatures, symbols or extra text."
  User Overrides:
    Format: "Recompose the textile field and reading sequence for the requested ratio."
    Palette: "Change yarn colours while preserving strong letter/background contrast."
    Fonts: "Translate the requested type direction into readable woven letter shapes."

Design Style:
  Name: Vintage Collage
  Concept: 'Expressive vintage editorial photomontage combines archival-looking photographic cutouts,
    paper fragments, flat graphic shapes and deliberately assembled typography. Images retain their separate
    identities: different scales, cut edges, paper borders and visible overlaps create a playful visual
    argument. Expressive type adds emphasis within a controlled reading order. The work feels authored
    and physically assembled, even when produced digitally. Its identity comes from these relationships
    rather than a fixed colour palette.

    '
  Canvas:
    Ratio: '4:5'
    Output: Single flat editorial quote card, full bleed
    Adaptation: 'This is the quote-card workflow''s default, not a fixed property inferred from the reference
      screenshot. Recompose for another requested ratio. The four reference panels are separate examples,
      not a mandatory mosaic.

      '
  Mood:
  - Expressive
  - Playful
  - Editorial
  - Graphic
  - Handmade
  - Unexpected
  - Slightly irreverent
  Color Palette:
    Fixed Colors: false
    Strategy: 'Select colours for each card from its content and the user''s preferences. Colour does
      not define this style. A quiet neutral field, a saturated field or a predominantly monochrome treatment
      can all support the same collage language. No particular hue or fluorescent palette is mandatory.

      '
    Roles:
      Ground: 'One dominant flat field or a small set of broad paper-like planes establishes the composition
        and separates the main masses.

        '
      Graphic Accent: 'A contrasting colour or tonal value gives selected bursts, circles, strips or counterweights
        their role in the composition.

        '
      Cutout Separation: 'White, paper tone or a palette colour may outline a cutout. Choose it for separation
        from the ground rather than as a fixed neon treatment.

        '
      Text and Paper: 'Maintain clear contrast between printed letters, paper slips and the field. Dark-on-light
        and light-on-dark treatments are both available.

        '
      Photographic Layer: 'Predominantly black-and-white or desaturated photographic reproductions form
        the reference language. Their tonal contrast matters more than the surrounding hue.

        '
    Selection: 'Keep the palette coherent and limited enough that photographs, text and graphic accents
      remain distinguishable. Choose colours afresh; do not inherit the colours of one reference panel
      as a permanent preset.

      '
  Typography:
    CutPaper:
      Style: Printed whole-word or short-phrase clippings on separate paper slips
      Character: 'Editorial serif, narrow print type or a coherent found-print character. Small differences
        of angle, baseline and slip dimensions make the assembly visible without breaking the reading
        order.

        '
      Role: A quotation integrated alongside the photographic protagonist
    Display:
      Style: Large assertive sans-serif or condensed poster lettering
      Character: 'Broad typographic masses may sit behind photographic cutouts or extend beyond a composition
        edge, provided the requested copy remains complete and legible. Use a coherent type choice rather
        than a different font for every letter.

        '
      Role: A structural typographic field or the main readable phrase
    Secondary:
      Style: Simple narrow or clean sans-serif
      Role: Quieter quotation fragments or supporting text actually supplied
    Hierarchy: 'Choose a primary typographic treatment for the card; do not combine all registers by default.
      Let the image carry a substantial visual role, while keeping the full quotation readable on a phone.
      Preserve the original case, accents and punctuation. Paper-slip composition does not require random
      ransom-note lettering.

      '
  Layout:
    Structure:
    - Asymmetrical editorial composition with one clear focal relationship
    - Visible layering of photographs, printed type and flat graphic planes
    - Expressive scale differences and selective overlap
    - A balance between concentrated activity and a quieter open field
    Relationships: 'Make the photographic cutouts, graphic accents and words interact. A burst can sit
      behind a silhouette; an oversized object can anchor a smaller figure; an image module can repeat
      at different angles; a paper phrase can follow an open interval beside a protagonist. Choose the
      relationship from the current content rather than scattering decorations.

      '
    Composition Families:
      Narrative Montage: 'Combine a small set of figures or objects at contrasting scales into an intentional,
        sometimes impossible interaction.

        '
      Iconic Cutout: 'Let one dominant photographic figure or object lead, supported by graphic counterweights
        and a readable typographic assembly.

        '
      Paired Stickers: 'Use two cutouts with a shared outline treatment and contrasting poses, orientations
        or scales, leaving clear intervals for the words.

        '
      Repeated Module: 'Repeat a photographic or object-shaped module with controlled changes of angle,
        scale or overlap. Repetition belongs to the imagery unless repetition of the supplied words is
        explicitly requested.

        '
    Selection: 'These are alternative compositional tools, not four required sections. Select a coherent
      family or a purposeful combination appropriate to the text. Avoid turning every card into the same
      central quote-and-icon layout.

      '
  Imagery:
    Style: Photographic cutouts and visibly assembled photomontage
    Treatment:
    - Black-and-white or desaturated photographic reproductions
    - Firm silhouette cuts with purposeful, slightly irregular contours
    - White paper borders or coloured sticker-like outlines when useful
    - High tonal contrast, with optional halftone or photocopy reproduction
    - Unexpected scale relationships and deliberately separate source perspectives
    Subjects:
    - People, poses and gestures relevant to the message
    - Everyday objects, tools and symbolic props
    - Archival-looking images and reproduced media objects
    Selection: 'Choose the subjects from the quotation and context. The chess scene, musician, reclining
      figures and television sets in the reference are examples of visual relationships, not recurring
      subjects or identities. The montage should remain visibly assembled rather than becoming a seamless
      photographic scene.

      '
  Graphic Elements:
    Repertoire:
    - Irregular radial starbursts and sharply cut accent shapes
    - Simple circles, flat panels and paper strips
    - Sparse dots or small graphic punctuation
    - Contours that separate a photographic silhouette from its ground
    Relationships: 'Place an accent behind, beside or partly under a cutout to create emphasis, direction
      or a counterweight. Repeat a few related graphic choices. Starbursts, outlines and dots are optional
      resources, not a mandatory checklist or a decoration for every corner.

      '
  Effects:
    Texture: 'Restrained matte print grain, light paper wear, subtle creases or photocopy texture where
      appropriate. Clean graphic fields are also compatible; texture must not become a generic distressed
      overlay.

      '
    Halftone: Optional treatment of selected photographic reproductions
    Shadows: 'Keep the composition mainly flat. Retain tonal shading within source photographs; use only
      restrained contact shadows where paper layering needs them. Do not inherit interface-badge shadows
      from the screenshot.

      '
    Depth: Cutout overlap, scale and outline separation rather than continuous 3D space
    Imperfection: Controlled cut edges, small rotations and deliberate print variation
  Rules:
  - Build a meaningful visual relationship before adding accents.
  - Preserve the supplied quotation verbatim, normally rendered once.
  - Keep the photographic, graphic and typographic layers visibly distinct yet compositionally connected.
  - Use colour freely while preserving tonal separation and readable contrast.
  - Give photography a substantial role; do not reduce the style to a large slogan and unrelated small
    icon.
  - Use only supplied supporting text and supplied or verified attribution.
  - Do not imitate newspaper copy, names, captions or printed metadata with invented words.
  - Do not repeat the source subjects, identities or reference wording automatically.
  - Do not reproduce the reference screenshot's four-panel layout, navigation arrows, central Mixed Media
    badge or other presentation overlays.
  - Avoid seamless photorealistic scenes, glossy rendered environments and indiscriminate decorative clutter.
  User Overrides:
    Format: Recompose the collage, focal relationship and reading sequence for the requested ratio.
    Palette: 'Honour any requested palette. No hue is essential to the style; maintain separation between
      ground, photographic layer, type and graphic accents.

      '
    Fonts: 'Honour the requested font direction while preserving collage expression through scale, paper
      slips, layering and spacing. Generated resemblance is not verification of an exact family.

      '
    Photography: 'Use supplied images or requested subjects where available. A request for coloured photography
      can override the monochrome default while retaining visible cutout assembly and graphic relationships.

      '
    Density: Adjust the number of fragments while preserving a clear focus and readable text.
  Production:
    Preferred Mode: hybrid
    Reason: Il profilo richiede identità visibili fra ritagli fotografici, forme piatte e tipografia assemblata.
      Un'immagine generata porta soggetti e relazioni; parole o gruppi di parole reali su strisce separate
      possono mantenere esattezza e simulare la stampa senza trasformarsi in lettere casuali.
    Content Adaptation: Per testi brevi si possono trattare parole o frasi come ritagli. Per citazioni
      lunghe passare a un blocco tipografico coerente e usare il collage solo come immagine; evitare il
      font ransom-note. Se i livelli non sono disponibili, conservare meno elementi invece di fingere
      la rotazione o il ritaglio.
    Required Capabilities: Maschere per ritagli, alpha layering, livelli di carta, rotazione contenuta
      delle strisce, grana stampata, bordi di ritaglio e controllo del testo su slips con metriche e ordine
      di lettura.
    Current Prototype: Può posizionare immagini e testo non ruotati; non implementa maschere, bordi, texture,
      rotazioni o texture di stampa. Un font overlay semplice non riproduce la relazione editoriale richiesta.
    Validation Status: Profilo non incluso nei tre render odierni. Il metodo ibrido è una valutazione
      progettuale, non un risultato visivo verificato.
